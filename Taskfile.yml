# Nexus Android — Taskfile
version: '3'

tasks:
  generate:
    desc: Generate Kotlin protobuf and Connect clients from nexus-proto
    cmds:
      - ./gradlew generateProtocol

  doctor:
    desc: Check the local Android build environment
    cmds:
      - bash scripts/check-env.sh

  build:
    desc: Build debug APK
    cmds:
      - ./gradlew assembleDebug

  build-release:
    desc: Build release APK
    cmds:
      - ./gradlew assembleRelease

  test:
    desc: Run unit tests
    cmds:
      - ./gradlew test

  lint:
    desc: Run Android lint
    cmds:
      - ./gradlew lint

  verify:
    desc: Run protocol generation, tests, lint, and debug/release builds
    cmds:
      - ./gradlew generateProtocol test lint assembleDebug bundleRelease

  clean:
    desc: Clean build artifacts
    cmds:
      - ./gradlew clean

  install:
    desc: Install debug APK on connected device
    cmds:
      - ./gradlew installDebug

  run-debug:
    desc: Build, install, and launch debug APK on local emulator
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/run-debug.ps1
        platforms: [windows]
      - cmd: ./scripts/run-debug.sh
        platforms: [darwin, linux]

  run-debug-fast:
    desc: Install and launch existing debug APK on local emulator
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File scripts/run-debug.ps1 -SkipBuild
        platforms: [windows]
      - cmd: ./scripts/run-debug.sh --skip-build
        platforms: [darwin, linux]
